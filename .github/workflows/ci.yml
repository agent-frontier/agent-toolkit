name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (syntax check)
        run: |
          for f in system-janitor.sh system-updater.sh cert-watch.sh log-shipper.sh install.sh scripts/*.sh tests/*.sh demos/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done

      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          scandir: '.'
          additional_files: |
            system-janitor.sh
            system-updater.sh
            cert-watch.sh
            log-shipper.sh
            install.sh

  smoke:
    name: dry-run smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run janitor smoke test
        run: ./tests/smoke.sh

      - name: Run updater smoke test
        if: hashFiles('system-updater.sh') != ''
        run: ./tests/updater-smoke.sh

      - name: Run cert-watch and log-shipper smoke tests
        run: |
          ./tests/cert-watch-smoke.sh
          ./tests/log-shipper-smoke.sh

      - name: Run capabilities registry check
        if: hashFiles('docs/agents/capabilities.md') != ''
        run: ./tests/capabilities-check.sh

      - name: Run cron and installer smoke tests
        run: |
          ./tests/cron-smoke.sh
          ./tests/cron-docs-smoke.sh
          ./tests/install-smoke.sh
          ./tests/bootstrap-smoke.sh
