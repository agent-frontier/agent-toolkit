site_name: agent-toolkit
site_url: https://agent-frontier.github.io/agent-toolkit/
site_description: Agent-first cron toolkit for Linux servers — JSONL audit trail, capability discovery, safe update previews.
site_author: agent-frontier
repo_url: https://github.com/agent-frontier/agent-toolkit
repo_name: agent-frontier/agent-toolkit
edit_uri: edit/main/
docs_dir: docs
site_dir: site/docs
exclude_docs: |
  /README.md

not_in_nav: |
  launch-copy.md

validation:
  anchors: ignore

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Agent contract: AGENTS.md
  - Install:
      - Quick start: install.md
      - Updater install: updater-install.md
      - Cert-watch install: cert-watch-install.md
      - Log-shipper install: log-shipper-install.md
      - Cron troubleshooting: cron-troubleshooting.md
  - Configuration:
      - Janitor: configuration.md
      - Updater: updater-configuration.md
  - Usage:
      - Janitor: usage.md
      - Updater: updater-usage.md
  - Reference:
      - Audit trail: audit-trail.md
      - Safety: safety.md
      - Comparison: comparison.md
      - Cookbook: cookbook.md
  - For agents:
      - Overview: agents/README.md
      - Machine modes (janitor): agents/machine-modes.md
      - Machine modes (updater): agents/updater-machine-modes.md
      - Contracts: agents/contracts.md
      - Updater contracts: agents/updater-contracts.md
      - Capabilities: agents/capabilities.md
      - Recovery: agents/recovery.md
      - Schemas: agents/schemas.md
      - Toolkit roadmap: agents/toolkit-roadmap.md
  - Roadmap: promotion-roadmap.md
  - Releasing: releasing.md
  - Contributing: CONTRIBUTING.md
  - Security: SECURITY.md
  - Changelog: CHANGELOG.md
